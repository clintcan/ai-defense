# Example policy. Copy to policy.yaml (git-ignored) and adapt.
# Default deny: anything not explicitly allowed is refused.

defaults:
  decision: deny

change_windows:
  web-prod: { days: [Tue, Thu], start: "02:00", end: "04:00", tz: UTC }

blast_radius_caps:
  mitigate_canary: 3
  patch_canary: 3
  mitigate_fleet: 500
  patch_fleet: 500

rate_limits:
  per_host_changes_per_hour: 2
  fleet_concurrency: 25

approvals:
  patch_canary:   { required: 1 }
  patch_fleet:    { required: 1, after: canary_health_ok }
  mitigate_fleet: { required: 1, after: canary_health_ok }
  emergency:      { required: 2 }   # outside window / KEV emergency

autonomous_action_classes: [discovery, scan, protective]
