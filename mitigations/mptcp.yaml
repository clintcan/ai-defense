# Multipath TCP attack-surface reduction, done as a persistent config drop-in:
# writes net.mptcp.enabled=0 to /etc/sysctl.d/ and applies it with `sysctl -p`
# (so it takes effect now AND survives reboot). Reverse removes the drop-in.
# This is defense in depth, not a single-CVE fix, so it's keyed under a plain
# hardening id (not a CVE) — run it with:  mitigate <host> MPTCP
#
# Both actions are allowlisted config actions in the reviewed catalog
# (ssh/catalog/configs.py); a file may reference one but can't define a new one.
- id: mptcp-disable
  cves: [MPTCP]
  title: Disable Multipath TCP persistently (/etc/sysctl.d drop-in)
  source_ref: https://docs.kernel.org/networking/mptcp-sysctl.html
  template: config.sysctl_mptcp_off
  rollback_template: config.sysctl_mptcp_off.remove
  description: >-
    write net.mptcp.enabled=0 to /etc/sysctl.d/80-ai-defense-mptcp.conf and apply
    it (sysctl -p); reverse removes the drop-in and reloads. The write runs via
    'sudo -n tee'; the reload doubles as validation and rolls back on failure.
