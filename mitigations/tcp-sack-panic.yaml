# SACK Panic (CVE-2019-11477 / CVE-2019-11478 / CVE-2019-11479): a remote
# attacker can crash or severely degrade a Linux host with crafted TCP Selective
# ACKs. Where the kernel can't be patched, the official mitigation is to disable
# TCP SACK. One entry covers all three CVEs.
#
# Both commands are allowlisted in the reviewed catalog (ssh/catalog/).
- id: sack-panic-disable-tcp-sack
  cves: [CVE-2019-11477, CVE-2019-11478, CVE-2019-11479]
  title: "SACK Panic: disable TCP Selective ACK (net.ipv4.tcp_sack=0)"
  source_ref: https://ubuntu.com/security/CVE-2019-11477
  template: harden.disable_tcp_sack
  rollback_template: harden.enable_tcp_sack
  description: >-
    runtime sysctl net.ipv4.tcp_sack=0 (reverse: =1); persist across reboot via
    a drop-in in /etc/sysctl.d. May slightly reduce throughput on lossy links.
