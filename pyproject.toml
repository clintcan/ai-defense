[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-defense"
version = "0.0.1"
description = "Defensive orchestration & remediation harness (LLM-as-planner, toolset-enforced)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",   # persistence layer (db/)
    # Pin and add as components are implemented. Suggested:
    #   "boto3",            # AWS adapter
    #   "google-cloud-compute",  # GCP adapter
    #   "azure-mgmt-compute",    # Azure adapter
    #   "paramiko",         # non-interactive SSH executor
    #   "hvac",             # HashiCorp Vault client
    #   "pydantic",         # intent/param schema validation
    #   "sqlalchemy",       # persistence
    #   "pyyaml",           # config loading
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pyyaml"]
aws = ["boto3>=1.34"]
mcp = ["mcp>=2,<3"]

[project.scripts]
ai-defense = "ai_defense.__main__:main"
register-vps = "ai_defense.onboarding:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE"]
# UP042: str+Enum is intentional (JSON-serializable .value, 3.11-compatible).
ignore = ["UP042"]
